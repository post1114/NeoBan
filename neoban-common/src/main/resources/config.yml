# NeoBan configuration file
# All messages are customizable; edit the values below to translate the plugin.
appeal:
  # Maximum number of appeals allowed per punishment (or per player lifetime, depending on count-scope)
  max-appeals: 5
  # Cooldown between appeals (minutes)
  cooldown-minutes: 60
  # Appeal counter scope: PER_PUNISHMENT (count per punishment) / LIFETIME (count for the player's lifetime)
  count-scope: PER_PUNISHMENT
  # Commands a banned player may use inside the appeal world
  allowed-commands:
    - "/appeal"
  world:
    # VOID: plugin generates a void world; CUSTOM: use an existing world (falls back to void if missing)
    type: VOID
    void-name: NeoBan_AppealVoid
    custom-name: appeal_world
    # Optional custom spawn point when type: CUSTOM (x/y/z must all be provided)
    custom-spawn:
      x: 0.5
      y: 65.0
      z: 0.5

